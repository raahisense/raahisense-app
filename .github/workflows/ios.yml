name: iOS

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  simulator:
    name: Build and test on the iOS Simulator
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Shared logic tests
        run: swift test --package-path ios/RaahiSenseLogic

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Choose a simulator
        id: sim
        run: |
          dest="$(python3 ios/scripts/pick_simulator.py)"
          {
            echo "destination<<EOF"
            echo "$dest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -euo pipefail
          xcodebuild test \
            -project ios/RaahiSense.xcodeproj \
            -scheme RaahiSense \
            -destination "${{ steps.sim.outputs.destination }}" \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM=""
